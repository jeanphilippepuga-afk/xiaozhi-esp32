name: Build Boards

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build spotpear-sp-esp32-s3-1.28-box
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v6.1
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build spotpear-sp-esp32-s3-1.28-box
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          python scripts/build.py spotpear/sp-esp32-s3-1.28-box

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: spotpear-sp-esp32-s3-1.28-box
          path: build/merged-binary.bin
          if-no-files-found: error
